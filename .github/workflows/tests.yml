name: Tests
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . snakemake==9.6.2
      - run: python -m unittest discover -s tests -v
      - run: snakemake -s MICPscope.smk --cores 1 --dry-run
      - name: Verify rendering dependency invalidation
        run: python tests/workflow_dependency_check.py
      - name: Verify generated-data retention through retries and reruns
        run: python tests/workflow_retention_check.py
      - run: snakemake -s MICPscope.smk --cores 1
      - run: test -s results/demo/micpscope/report.html
      - run: snakemake -s MICPscope.smk --cores 1 --dry-run
      - name: Verify packaged catalog
        working-directory: /tmp
        run: python -c "from micpscope.knowledge import load_catalog; catalog, digest = load_catalog(); assert len(catalog['entries']) >= 20"
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      # Use Python built for this Noble image, not a host toolcache interpreter.
      # ubuntu-latest can have a newer libc/OpenSSL than the container.
      - name: Check container Python and TLS
        run: python -c "import ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION)"
      - run: python -m pip install . 'playwright==1.64.1'
      - run: python tests/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micpscope-report-previews
          path: ui-previews/*.png
  database-builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: database-builder-ci
          environment-file: envs/controller-retention-test.yml
      # Do not replace the native snakemake-minimal distribution with a pip wheel.
      - run: python -m pip install --no-deps .
      - name: Verify native Conda controller identity and retention
        run: |
          python -c "import importlib.metadata, snakemake; from micpscope.artifact_retention import runtime_version; print('runtime', snakemake.__version__, 'distribution', importlib.metadata.version('snakemake')); assert runtime_version() == '9.6.2'"
          python tests/workflow_retention_check.py
          python tests/workflow_dependency_check.py
      - name: Build and verify a synthetic reference with real DIAMOND
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'tests'); from test_database_builder import DatabaseBuilderTests; p=Path('builder-fixture').resolve(); p.mkdir(); DatabaseBuilderTests().fixture(p)"
          snakemake -s DatabaseBuilder.smk --cores 1 --config reference_spec=builder-fixture/spec.yaml build_dir=builder-fixture/output
          python database_builder/build.py verify builder-fixture/output/database builder-fixture/verified.json
          snakemake -s DatabaseBuilder.smk --cores 1 --dry-run --config reference_spec=builder-fixture/spec.yaml build_dir=builder-fixture/output
      - name: Build bundled literature starter without reference downloads
        run: |
          snakemake -s DatabaseBuilder.smk --cores 1 --config build_dir=starter-output
          python database_builder/build.py verify starter-output/database starter-output/verified.json
          snakemake -s DatabaseBuilder.smk --cores 1 --dry-run --config build_dir=starter-output
      - name: Search bundled references and render evidence with real DIAMOND
        run: python tests/reference_smoke.py
  publish:
    needs: [test, browser, database-builder]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish named, tested source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="genescope-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "GeneScope ${version}" --prerelease --notes-file docs/release-notes.md src/micpscope/data/micp_catalog.json
          fi

