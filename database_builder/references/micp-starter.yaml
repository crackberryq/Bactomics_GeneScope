    row: 2
    fields:
    - heading: Reference system
      text: B. subtilis mother-cell program, σE/σK with SpoIIID, GerR and GerE [S2]
    - heading: What the primary study establishes
      text: Integrated transcriptional and DNA-binding evidence describes a timed
        regulatory hierarchy. The paper mapped 18 newly identified σK-associated transcript
        starts by 5′ RACE; other candidates came from expression and computational
        analyses.
    - heading: Evidence classification and limit
      text: The 18 mapped sites should be distinguished from predicted sites. Supplemental
        Figure S2 is the record-level sequence/TSS source; Figure S1 includes SpoIIID
        footprints. A consensus sequence is an aggregate model, not a native promoter
        sequence.
    curation_status: review_evidence_preserved; individual claims not independently
