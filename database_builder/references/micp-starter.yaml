      category: matrix
      function: Forms extracellular fibres that help maintain biofilm structure.
      references:
      - matrix2010
      scope: B. subtilis matrix function; not sufficient evidence of carbonate precipitation.
      evidence_level: indirect biological context
    - id: spo0A
      gene_symbols:
      - spo0A
      protein_name: Sporulation response regulator Spo0A
      product_aliases:
      - sporulation response regulator spo0a
      category: sporulation
      function: Transcriptional regulator associated with entry into sporulation.
      references:
      - spo0a2005
      scope: B. subtilis developmental context. Does not establish spore formation,
        survival, shelf life, or MICP activity.
      evidence_level: indirect biological context
