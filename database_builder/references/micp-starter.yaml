    source_id: regulation
    table: 6
    row: 7
    fields:
    - heading: Reference system
      text: Synechococcus elongatus PCC 7942 cmp operon [S7]
    - heading: What the primary study establishes
      text: Reporter-based analysis identified three cis-acting regulatory elements
        in a low-CO2-responsive promoter region; gel-shift assays supported direct
        CmpR binding. Metabolite effects on binding connected carbon status to transcriptional
        regulation.
    - heading: Evidence classification and limit
      text: Native promoter/regulator interaction evidence for bicarbonate acquisition.
        This demonstrates carbon-concentrating-mechanism regulation, not a demonstrated
        promoter-to-calcification causal chain.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
