  - id: regulation.table5.row1
    source_id: regulation
    table: 5
    row: 1
    fields:
    - heading: Target and source system
      text: B1. P_tapA (historically P_yqxM), tapA–sipW–tasA; B. subtilis
    - heading: What was established
      text: Chu et al. (2006) identified the matrix operon as a direct SinR target.
        Binding at multiple promoter-region sites supported direct repression; transcript
        profiling placed both matrix operons among strong SinR-regulated targets.
    - heading: Evidence boundary and MICP Scope representation
      text: Encode SinR→promoter repression separately from operon membership and
        matrix phenotype. The historical gene alias yqxM should resolve to tapA, preserving
        the source terminology. This is direct regulation of a matrix locus, not direct
        evidence of MICP regulation.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row2
    source_id: regulation
    table: 5
    row: 2
    fields:
    - heading: Target and source system
      text: B2. P_tapA and slrR/eps shared intergenic region; B. subtilis 3610 derivatives
    - heading: What was established
      text: Chu et al. (2008) used reporter genetics, EMSA and DNase I protection
        to distinguish AbrB regulation. AbrB bound the tested tapA/yqxM promoter DNA;
        binding to the tested eps promoter fragment was not detected. Slr (now SlrR)
        affected tapA transcription and was itself under SinR/AbrB control.
    - heading: Evidence boundary and MICP Scope representation
      text: 'Store separate edges with separate methods. An expression effect on eps
        must not automatically become a direct AbrB-binding claim. SlrR and eps are
        divergently oriented: a shared intergenic regulatory region is not a shared
        operon.'
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row3
    source_id: regulation
    table: 5
    row: 3
    fields:
    - heading: Target and source system
      text: B3. P_eps, P_tapA and P_opuA; B. subtilis NCIB3610 derivatives
    - heading: What was established
      text: RemA bound all three regions and activated P_eps and P_tapA in vitro.
        P_opuA showed in vivo activation and binding, but RemA alone was insufficient
        in vitro. SinR competed with RemA at P_eps, supporting anti-activation.
    - heading: Evidence boundary and MICP Scope representation
      text: Distinguish direct activation from antagonism. opuA connects RemA to osmoprotection.
        These experiments do not establish the same direct binding mechanism for RemB.
        SinR occupies −78 to −52 relative to the eps TSS.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row4
    source_id: regulation
    table: 5
    row: 4
    fields:
    - heading: Target and source system
      text: B4. P_sinI and P_sinR; B. subtilis 3610
    - heading: What was established
      text: Chai et al. (2008) compared promoter reporters at single-cell resolution.
        P_sinI activity occurred in a subpopulation under the tested biofilm conditions,
        while P_sinR activity was much more broadly distributed. The analysis related
        this heterogeneity to SinI antagonism of SinR.
    - heading: Evidence boundary and MICP Scope representation
      text: A bulk RNA or average reporter result does not imply uniform expression
        across the population. This paper supports cell-state-dependent promoter activity,
        rather than providing a new genome-wide TSS map. Store conditions, population
        fraction and assay level when available.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row5
    source_id: regulation
    table: 5
    row: 5
    fields:
    - heading: Target and source system
      text: B5. fla/che P_A and P_D-3; B. subtilis LMB1 and derivatives
    - heading: What was established
      text: Estacio et al. (1998) combined sequence analysis, primer extension and
        genetics to establish active σA- and σD-dependent promoters upstream of flgB.
        P_D-3 initiation depended on SigD and was influenced by the anti-sigma factor
        FlgM.
    - heading: Evidence boundary and MICP Scope representation
      text: This is a clear example of experimentally mapped transcription initiation.
        Multiple promoters feed a long transcription unit containing sigD; sigD is
        not necessarily controlled only by the immediately adjacent upstream sequence.
        Record promoter-specific TSSs and sigma dependence independently.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row6
    source_id: regulation
    table: 5
    row: 6
    fields:
    - heading: Target and source system
      text: B6. fla/che P_A and P_D3; B. subtilis strain/allele comparisons
    - heading: What was established
      text: Mordini et al. (2013) used promoter-expression analysis, mobility-shift
        assays and motility phenotypes to support cooperation between SwrA and phosphorylated
        DegU at P_A. Their P_D3 interpretation depended on the swrA functional state.
    - heading: Evidence boundary and MICP Scope representation
      text: 'Regulatory sign is contextual: the authors described DegU~P as activating
        with SwrA and repressing without it. Preserve the tested genotype and protein
        state. Do not convert this into an unconditional claim that DegU always represses
        motility or that every B. subtilis isolate has functional swrA.'
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row7
    source_id: regulation
    table: 5
    row: 7
    fields:
    - heading: Target and source system
      text: B7. P_fla/che and other DegU-associated regions; B. subtilis 3610 derivatives
    - heading: What was established
      text: Mishra et al. (2024 issue; online 2023) used ChIP-seq, footprinting and
        reporter evidence to refine the mechanism. SwrA associated with a subset of
        DegU-enriched regions in a DegU-dependent manner. They established a functional
        DegU-binding region and an adjacent upstream activation sequence at P_fla/che.
    - heading: Evidence boundary and MICP Scope representation
      text: ChIP association does not establish direct DNA contact by SwrA. The proposed
        SwrA-driven multimerization and contact with RNA polymerase remain mechanistic
        interpretations supported by the data. Keep the upstream activation sequence
        distinct from the core promoter and from the DegU site; it is UP-element-like,
        with direct RNAP-α binding not demonstrated in this study.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row8
    source_id: regulation
    table: 5
    row: 8
    fields:
    - heading: Target and source system
      text: B8. P_srfA and other ComA targets; B. subtilis JH642 derivatives
    - heading: What was established
      text: Griffith and Grossman (2008) combined regulatory-DNA mutational analysis,
        promoter reporters and in vitro binding to show that ComA recognition involves
        a degenerate tripartite arrangement. Earlier two-half-site descriptions were
        incomplete for the targets examined.
    - heading: Evidence boundary and MICP Scope representation
      text: 'ComA is the DNA-binding output regulator of a peptide-responsive signaling
        system. ComQ, ComX and ComP should not each receive a direct promoter-binding
        edge. Motif occurrence alone is insufficient: spacing, promoter position and
        sequence context matter. This supports an evidence layer for regulator-binding
        sites in addition to promoter cores.'
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row9
    source_id: regulation
    table: 5
    row: 9
    fields:
    - heading: Target and source system
      text: B9. P_yuaB (bslA) and P_yvcA; B. subtilis NCIB3610 derivatives
    - heading: What was established
      text: Verhamme et al. (2009) established DegU~P-dependent activation and direct
        AbrB binding to both promoter regions. Spo0A acted through repression of abrB.
        Their tests did not support direct SinR interaction with these promoter regions.
    - heading: Evidence boundary and MICP Scope representation
      text: Distinguish the direct AbrB edge from the indirect Spo0A→AbrB→target chain.
        The historical yuaB name should be cross-referenced to bslA. Increased expression
        in a sinR mutant does not itself show SinR promoter binding. Preserve this
        negative binding result within the tested assay context.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table5.row10
    source_id: regulation
    table: 5
    row: 10
    fields:
    - heading: Target and source system
      text: B10. meeY/ykoY and yybP regulation; B. subtilis NCIB3610
    - heading: What was established
      text: Sachla, Piñeros and Helmann (2026) linked these manganese-riboswitch-regulated
        proteins to EPS production and matrix metalation. Genetic and phenotype analyses
        connected their loss with altered biofilms and divalent-ion association.
    - heading: Evidence boundary and MICP Scope representation
      text: 'This expands the regulatory layer beyond promoters: a riboswitch is an
        RNA regulatory element, whose genomic locus can be represented separately.
        The study does not prove a direct promoter-binding function for MeeY or YybP,
        and matrix-associated calcium is not automatically calcium-carbonate precipitation.'
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids:
    - uniprot_O34997
    - uniprot_P37488
    sequence_coverage: selected_reference_available
