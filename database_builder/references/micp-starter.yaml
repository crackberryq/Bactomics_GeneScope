    table: 6
    row: 5
    fields:
    - heading: Reference system
      text: B. subtilis 168-derived strains; spo0E σB promoter [S5]
    - heading: What the primary study establishes
      text: Northern analysis and primer extension associate a σB-dependent transcript
        with a distinct upstream promoter. Promoter deletion linked this regulatory
        input to suppression of sporulation. The core promoter was reported approximately
        150 bases upstream of the coding start.
    - heading: Evidence classification and limit
      text: Mapped transcript-start and functional-promoter evidence, with the exact
        tested conditions retained. “Approximately −150 from the start codon” is not
        an exact TSS coordinate or an accession-based genomic position. Existing spo0E
        promoters are separate records.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
