    - heading: Evidence type
      text: Differential RNA-seq (dRNA-seq/TEX)
    - heading: What it supports
      text: Candidate primary TSSs by comparing untreated and primary-transcript-enriched
        RNA
    - heading: Boundary of the claim
      text: Exonuclease susceptibility distinguishes many processed from primary ends,
        but the result remains conditional on RNA chemistry, expression and analysis
        criteria. This is a method classification, independent of the species used
        in its original demonstration. [D1]
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
  - id: regulation.table8.row4
    source_id: regulation
    table: 8
    row: 4
    fields:
    - heading: Evidence type
      text: Cappable-seq
    - heading: What it supports
      text: Enriched primary 5′ ends, enabling single-base TSS maps
    - heading: Boundary of the claim
      text: Captures RNA retaining suitable initiating phosphate chemistry. The original
        study discusses missed/discordant sites caused by condition, depth and analytical
        differences, and documents that some processed ends can confound TEX-based
        calls. No detected TSS under one condition does not establish promoter absence.
        [D2]
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
