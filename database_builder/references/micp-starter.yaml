  - id: regulation.table8.row5
    source_id: regulation
    table: 8
    row: 5
    fields:
    - heading: Evidence type
      text: Long-read primary-transcript mapping
    - heading: What it supports
      text: Which genes occur on the same RNA molecules and which transcript variants
        coexist
    - heading: Boundary of the claim
      text: SMRT-Cappable-seq demonstrated alternative operon structures and termination
        read-through. Its 3′-end inference is less direct than its chemically selected
        5′ ends, and requires filtering. A single universal TU per locus would discard
        real variation. [D3]
