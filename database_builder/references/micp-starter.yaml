      text: Synechococcus sp. PCC 7002 CcmR-related carbon uptake loci [S8]
    - heading: What the primary study establishes
      text: Genetic, transcript, reporter and 5′-mapping analyses characterized a
        CcmR-responsive bicarbonate transport system. A notable ndhF3 result combined
        a mapped RNA 5′ end and promoter-like sequence with no significant reporter
        activity from the tested upstream region.
    - heading: Evidence classification and limit
      text: Keep the conflicting/limited observations rather than declaring a validated
        promoter from motif or 5′ mapping alone. The negative reporter is context-specific;
        it does not prove that no promoter can operate there under any condition.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
