    scope: Focused starter review for descriptive MICP annotation reporting; not an
      exhaustive gene inventory or a sequence reference database.
    curation_policy: Primary studies support biological entries. Header matches are
      unverified supplied annotations. Indirect context is distinct from MICP-specific
      evidence. No engineering interventions or operating recipes are encoded.
