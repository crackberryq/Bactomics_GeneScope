    row: 9
    fields:
    - heading: Reference system
      text: Synechocystis sp. PCC 6803 NdhR/CcmR [S9]
    - heading: What the primary study establishes
      text: Structural, biochemical, target-DNA binding and transcript analyses connect
        NdhR regulation to carbon/nitrogen metabolites. Opposite effects on regulatory
        activity are supported for 2-oxoglutarate and 2-phosphoglycolate.
    - heading: Evidence classification and limit
      text: Direct regulator–DNA/effector evidence does not itself map a new TSS or
        validate every target promoter in the regulon. Useful for recording conditional
        regulatory relationships, not predicting MICP output.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
