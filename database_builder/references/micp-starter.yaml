      protein_name: Putative fatty-acid metabolism protein
      product_aliases: []
      category: mineral_context
      function: Putative metabolic component of the studied cluster.
      references:
      - calcite2007
      scope: B. subtilis 168 cluster association. Stronger gene-specific evidence
        for etfA; cluster membership is not proof of a direct precipitation function.
      evidence_level: cluster context
    - id: tasA
      gene_symbols:
      - tasA
      protein_name: Biofilm matrix protein TasA
      product_aliases:
