    - heading: Record-level limit
      text: A mapped RNA start plus an FNR-family motif does not identify which family
        member directly occupies it. Retain transcript structure and motif evidence
        separately from NNR/NnrR regulatory assignments. No absolute genome coordinates
        established here.
