      text: B. subtilis forespore program, σF/σG with RsfA and SpoVT [S3]
    - heading: What the primary study establishes
      text: Transcriptional profiling establishes sequential and combinatorial regulatory
        control of the forespore program. The study connects downstream genes with
        spore morphogenesis, resistance and germination.
    - heading: Evidence classification and limit
      text: Treat its regulon assignments as expression/regulatory evidence unless
        an individual entry supplies an independent mapped start or binding experiment.
        This is not a list of universally required MICP promoters.
    curation_status: review_evidence_preserved; individual claims not independently
