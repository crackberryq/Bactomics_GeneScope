    source_id: regulation
    table: 6
    row: 1
    fields:
    - heading: Reference system
      text: B. subtilis Spo0A regulon [S1]
    - heading: What the primary study establishes
      text: Combined ChIP–microarray, transcriptional profiles, binding assays and
        sequence analysis identified a set of likely direct Spo0A targets, distinct
        from the much larger set whose expression changed with Spo0A.
    - heading: Evidence classification and limit
      text: Direct-binding/regulatory evidence is target-specific. Membership in an
        expression regulon does not make every gene a directly bound promoter, and
        an operon-level assignment does not supply a separate promoter for every CDS.
    curation_status: review_evidence_preserved; individual claims not independently
