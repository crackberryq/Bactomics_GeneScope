    fields:
    - heading: Reference system
      text: B. subtilis sigG promoter [S4]
    - heading: What the primary study establishes
      text: Promoter dissection and mutant analysis support a requirement for mother-cell
        σE activity in the normal σF-directed transcription of sigG in the forespore.
        The minimal tested regulatory region extended just upstream of the −35 element.
    - heading: Evidence classification and limit
      text: The dependence on σE is an intercompartmental regulatory relationship,
        not evidence that σE directly recognizes the sigG promoter. The proposed repressor-binding
        feature was an inference; do not promote it to an experimentally identified
        regulator–site pair.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
