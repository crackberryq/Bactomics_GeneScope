        nos [A3]
    - heading: Evidence and interpretation
      text: Regulator-mutant respiratory phenotypes support combined control of nitrate
        reduction by FnrP/NarR and alternative induction of nitrous oxide reductase
        through FnrP or NNR. NNR is the regulator also associated with nir/nor expression.
    - heading: Record-level limit
      text: This study’s principal new evidence is physiological and genetic. It should
        not be entered as a new nos TSS map or direct occupancy experiment. Similar
        FNR-family motif recognition cannot distinguish regulator identity by sequence
        alone.
    curation_status: review_evidence_preserved; individual claims not independently
