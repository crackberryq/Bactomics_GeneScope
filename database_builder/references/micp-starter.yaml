        Protein-step definitions from KEGG [K1; curated pathway inference]; These
        are alternatives and sequential steps, not a universal single operon. A nitrate
        reductase hit alone does not establish complete denitrification. The individual
        genes were not all shown causally necessary for MICP in A1/A2. Incomplete
        nitrogen transformations and gas production affect environmental interpretation.
