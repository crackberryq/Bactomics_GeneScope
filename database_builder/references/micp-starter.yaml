        RACE identified condition-associated starts reported at −122 and −64 relative
        to the assumed coding start; the Rex site was reported at −150 to −131.
    - heading: Record-level limit
      text: Keep these as published relative positions, including the assumed-start
        caveat. The nearby −35 element remained predicted. Do not extend experimentally
