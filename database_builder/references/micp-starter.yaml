    table: 6
    row: 6
    fields:
    - heading: Reference system
      text: B. subtilis spo0A Pv/Ps [S6]
    - heading: What the primary study establishes
      text: The 2025 study analyzes a σA-associated vegetative promoter and a σH-associated
        starvation promoter together with four intervening Spo0A-binding sites. Binding-affinity
        and promoter/targeted-site analysis support concentration-dependent autoregulatory
        behavior.
    - heading: Evidence classification and limit
      text: A multi-promoter locus with regulator-dependent effects. Presence of both
        promoter sequences cannot predict the time course or magnitude of expression
        in another strain. Bindings sites, promoters and the regulator gene need separate
        entities.
    curation_status: review_evidence_preserved; individual claims not independently
      revalidated
    sequence_accessions: []
    absolute_coordinates: null
    sequence_reference_ids: []
    sequence_coverage: literature_only
