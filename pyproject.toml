[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bactomics-micpscope"
version = "0.1.0a16"
description = "GeneScope application-driven genome and protein evidence"
requires-python = ">=3.10"
dependencies = ["biopython==1.86"]

[project.urls]
Repository = "https://github.com/crackberryq/Bactomics_GeneScope"
Issues = "https://github.com/crackberryq/Bactomics_GeneScope/issues"

[project.scripts]
genescope = "micpscope.cli:main"
micpscope = "micpscope.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micpscope = ["data/*.json"]

